[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-error-coach"
version = "0.1.0"
description = "Explain a SQL error in plain English and show a corrected query."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Veliation AI" }]
keywords = ["sql", "postgres", "mysql", "sqlite", "sqlserver", "learning"]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27.0"]

[project.scripts]
sql-error-coach = "sql_error_coach.cli:app"

[project.urls]
Homepage = "https://github.com/VeliationAI/sql-error-coach"
Repository = "https://github.com/VeliationAI/sql-error-coach"

[tool.setuptools.packages.find]
include = ["sql_error_coach*"]

[tool.setuptools.package-data]
sql_error_coach = ["static/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
